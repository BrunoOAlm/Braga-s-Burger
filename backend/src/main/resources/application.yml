spring:
  application:
    name: bragas-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: false
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  store:
    minOrder: 25.00
    averagePrepTime: 25
    openingHours:
      sun: { open: "18:00", close: "00:00" }
      tue: { open: "18:00", close: "23:40" }
      wed: { open: "18:00", close: "23:40" }
      thu: { open: "18:00", close: "23:40" }
      fri: { open: "18:00", close: "00:00" }
      sat: { open: "18:00", close: "00:00" }
  admin:
    token: ${ADMIN_TOKEN}
  cors:
    allowedOrigins:
      - "http://localhost:3000"
