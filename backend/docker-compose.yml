services:
  postgres:
    image: postgres:16
    container_name: bragas-postgres
    environment:
      POSTGRES_DB: bragas
      POSTGRES_USER: bragas
      POSTGRES_PASSWORD: bragas
    ports:
      - "5433:5432"
    volumes:
      - bragas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bragas -d bragas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bragas-postgres-data:
